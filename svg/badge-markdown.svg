<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(220,210,180,0.25)"/>
    </filter>
  </defs>
  <rect width="420" height="340" rx="16" fill="#ffffff"/>
  <rect x="0" y="0" width="420" height="44" rx="16" fill="#f8fafc"/>
  <rect x="0" y="28" width="420" height="16" fill="#f8fafc"/>
  <text x="24" y="28" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a" font-weight="700">Markdown Editor</text>
  <g filter="url(#s)">
    <rect x="20" y="56" width="380" height="120" rx="12" fill="#fffbe6" stroke="#e6dfc3" stroke-width="1"/>
    <rect x="340" y="64" width="48" height="18" rx="6" fill="#22c55e"/>
    <text x="364" y="77" font-family="system-ui,sans-serif" font-size="8" fill="#ffffff" font-weight="600" text-anchor="middle">EDIT</text>
    <text x="32" y="96" font-family="monospace" font-size="11" fill="#332d1c"># Meeting notes</text>
    <text x="32" y="116" font-family="monospace" font-size="11" fill="#64748b">- [x] Review Q2 roadmap</text>
    <text x="32" y="136" font-family="monospace" font-size="11" fill="#332d1c">- [ ] Draft agenda for Wed</text>
    <text x="32" y="156" font-family="monospace" font-size="11" fill="#332d1c">- Use **bold** for important items</text>
    <rect x="268" y="148" width="1" height="14" fill="#4f46e5">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="210" y="210" font-family="system-ui,sans-serif" font-size="16" fill="#4f46e5" text-anchor="middle">&#x2193;</text>
  <g filter="url(#s)">
    <rect x="20" y="226" width="380" height="100" rx="12" fill="#fffbe6" stroke="#e6dfc3" stroke-width="1"/>
    <rect x="340" y="234" width="48" height="18" rx="6" fill="#4f46e5"/>
    <text x="364" y="247" font-family="system-ui,sans-serif" font-size="8" fill="#ffffff" font-weight="600" text-anchor="middle">VIEW</text>
    <text x="32" y="268" font-family="system-ui,sans-serif" font-size="14" fill="#332d1c" font-weight="700">Meeting notes</text>
    <rect x="32" y="280" width="8" height="8" rx="2" fill="none" stroke="#332d1c" stroke-width="1"/>
    <polyline points="32.5,283.5 35,286 39,281" stroke="#22c55e" stroke-width="2" fill="none"/>
    <text x="46" y="289" font-family="system-ui,sans-serif" font-size="10" fill="#332d1c" opacity="0.7" text-decoration="line-through">Review Q2 roadmap</text>
    <rect x="32" y="302" width="8" height="8" rx="2" fill="none" stroke="#332d1c" stroke-width="1"/>
    <text x="46" y="311" font-family="system-ui,sans-serif" font-size="10" fill="#332d1c">Draft agenda for Wed</text>
    <text x="32" y="326" font-family="system-ui,sans-serif" font-size="10" fill="#332d1c">Use <tspan font-weight="700">bold</tspan> for important items</text>
