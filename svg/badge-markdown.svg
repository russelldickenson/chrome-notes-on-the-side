  <text x="48" y="208" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Write</text>
  <text x="80" y="208" font-family="monospace" font-size="9" fill="#4f46e5">**bold**</text>
  <text x="126" y="208" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">- lists</text>
  <text x="168" y="208" font-family="monospace" font-size="9" fill="#4f46e5">- [x] checkboxes</text>
