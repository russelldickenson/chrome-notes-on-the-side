<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Notes Sidebar</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="icon" type="image/png" href="icon-32.png">
</head>
<body>
  <div class="app-container">
    <!-- Dynamic Header -->
    <header class="app-header">
      <!-- List View Header -->
      <div id="header-list-view" class="header-content header-list-view-inline">
        <!-- Tag Filter Bar -->
        <div id="tag-filter-bar" class="tag-filter-bar"></div>
        <button id="add-note-btn" class="btn btn-add-note" aria-label="Add new note" title="New note">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>

      <!-- Editor View Header -->
      <div id="header-edit-view" class="header-content" style="display: none;">
        <button id="back-btn" class="btn btn-secondary" aria-label="Go back to all notes">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>All notes</span>
        </button>
        <div class="header-edit-right">
          <span id="save-status" class="save-status" role="status" aria-live="polite">Saved</span>
          <div class="toggle-mode-container">
            <button id="toggle-view-btn" class="btn-toggle active" type="button" aria-label="View mode" aria-pressed="true" title="View mode">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button id="toggle-edit-btn" class="btn-toggle" type="button" aria-label="Edit mode" aria-pressed="false" title="Edit mode">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Views Container -->
    <main class="main-content">
      <!-- 1. List View Container -->
      <div id="list-view-container" class="view-container">
        <!-- Empty state placeholder -->
        <div id="empty-state" class="empty-state">
          <div class="empty-icon-wrapper">
            <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
              <line x1="9" y1="11" x2="15" y2="11"/>
              <line x1="9" y1="18" x2="11" y2="18"/>
            </svg>
          </div>
          <p class="empty-title">No notes yet</p>
          <p class="empty-desc">Click the Add Note button above to capture your thoughts, tasks, and ideas.</p>
        </div>

        <!-- Notes Preview Grid -->
        <div id="notes-grid" class="notes-grid"></div>
      </div>

      <!-- 2. Editor View Container -->
      <div id="editor-view-container" class="view-container" style="display: none;">
        <!-- Tags Area (Top, Outside Note Paper) -->
        <div id="editor-tags-wrapper" class="editor-tags-wrapper">
          <!-- Edit Mode Tags -->
          <div id="editor-tags-edit-section" class="tags-section">
            <div class="tags-edit-header">
              <label for="editor-tag-input" class="tags-label">Tags</label>
              <input type="text" id="editor-tag-input" class="tags-input-field" placeholder="Add tag..." aria-label="Add Tag" />
            </div>
            <div id="editor-tag-list" class="editor-tag-list"></div>
          </div>
          
          <!-- Preview/View Mode Tags -->
          <div id="editor-tags-view-section" class="tags-section view-only" style="display: none;">
            <div id="editor-view-tag-list" class="editor-tag-list"></div>
          </div>
        </div>

        <div class="editor-paper">
          <!-- Edit Fields Container -->
          <div id="editor-edit-fields">
            <textarea id="editor-content" class="editor-content-textarea" placeholder="Start typing your note... Use **bold**, - lists, or - [ ] checkboxes" aria-label="Note Content"></textarea>
          </div>

          <!-- View Fields Container (Read-Only Render) -->
          <div id="editor-view-fields" style="display: none;">
            <div id="editor-view-content" class="editor-content-view"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
